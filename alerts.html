<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF KPI Monitoring Alerts</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.classList.add('light-theme');
            }
        })();
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-dark: #090d16;
            --panel-bg: #121824;
            --panel-border: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --card-inner-bg: #0f172a;
            --btn-bg: #1e293b;
            --btn-border: #1e293b;
            --btn-hover-bg: #334155;
            --card-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
            --blue: #3b82f6;
            --blue-glow: rgba(59, 130, 246, 0.15);
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.15);
            --red: #f43f5e;
            --red-glow: rgba(244, 63, 94, 0.15);
            --orange: #f59e0b;
            --orange-glow: rgba(245, 158, 11, 0.15);
            --radius-lg: 12px;
            --radius-md: 8px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html.light-theme body,
        body.light-theme {
            --bg-dark: #f1f5f9;
            --panel-bg: #ffffff;
            --panel-border: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --card-inner-bg: #f8fafc;
            --btn-bg: #ffffff;
            --btn-border: #cbd5e1;
            --btn-hover-bg: #e2e8f0;
            --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.06), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .btn:hover {
            background: var(--btn-hover-bg);
            border-color: var(--blue);
        }
        .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
        .btn-primary:hover { background: #2563eb; }

        .container { max-width: 1280px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }

        /* ── Page Header ──────────────────────── */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 4px;
        }

        .page-title {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }

        /* ── Clean Simple Alert Cards ─────────── */
        .alerts-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .alert-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-lg);
            padding: 18px 22px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
            transition: var(--transition);
        }

        .alert-card:hover {
            border-color: var(--blue);
            transform: translateY(-2px);
        }

        .alert-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .alert-title {
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }

        .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-critical { background: var(--red-glow); color: var(--red); border: 1px solid rgba(244, 63, 94, 0.3); }
        .badge-warning { background: var(--orange-glow); color: var(--orange); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-active { background: var(--blue-glow); color: var(--blue); border: 1px solid rgba(59, 130, 246, 0.3); }

        .alert-time { font-size: 12px; color: var(--text-secondary); }

        .alert-summary {
            font-size: 13.5px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .alert-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--panel-border);
            padding-top: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .meta-id { font-size: 12px; color: var(--text-secondary); font-family: 'JetBrains Mono', monospace; }

        @media (max-width: 768px) {
            .container { padding: 16px; gap: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Page Title Heading -->
        <div class="page-header">
            <h1 class="page-title">🚨 SF KPI Monitoring Alerts</h1>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="btn-theme-toggle" class="btn" onclick="toggleTheme()" aria-label="Toggle Theme" style="padding: 6px 12px;">
                    <svg id="theme-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"></svg>
                </button>
            </div>
        </div>

        <!-- Alerts List Grid -->
        <div class="alerts-grid" id="alertsList">
            <div style="text-align: center; color: var(--text-secondary); padding: 40px;">Loading Alerts...</div>
        </div>
    </div>

    <script>
        let allAlerts = [];
        let activeBreachesMap = {};

        const slugMap = {
            'time-to-hire': '/timetohire',
            'time to hire': '/timetohire',
            'onboarding': '/onboarding',
            'attrition': '/attrition',
            'employee attrition rate': '/attrition',
            'offboarding': '/offboarding',
            'offboarding completion time': '/offboarding'
        };

        function getKpiUrl(kpiName) {
            const lower = (kpiName || '').toLowerCase();
            for (let key in slugMap) {
                if (lower.includes(key)) return slugMap[key];
            }
            return '/dashboard';
        }

        // Helper to format a single short message sentence
        function formatShortSummary(summaryHtml) {
            if (!summaryHtml) return 'No summary text available.';
            const tmp = document.createElement("DIV");
            tmp.innerHTML = summaryHtml;
            const plain = tmp.textContent || tmp.innerText || "";
            const sentences = plain.split(/(?<=[.!?])\s+/).filter(s => s.trim().length > 10);
            
            if (sentences.length > 0) {
                return sentences[0].trim();
            }
            return plain;
        }

        async function loadAlerts() {
            try {
                const res = await fetch('/api/alerts');
                const data = await res.json();
                let rawAlerts = data.alerts || [];
                activeBreachesMap = data.active_breaches || {};

                // Sort descending by timestamp or numeric id so latest/newest alerts are on top
                rawAlerts.sort((a, b) => {
                    const timeA = a.timestamp ? new Date(a.timestamp).getTime() : (parseFloat(a.id) || 0);
                    const timeB = b.timestamp ? new Date(b.timestamp).getTime() : (parseFloat(b.id) || 0);
                    return timeB - timeA;
                });

                // Show only the latest 10 KPIs
                allAlerts = rawAlerts.slice(0, 10);

                renderAlerts();
            } catch (err) {
                console.error('Error fetching alerts:', err);
            }
        }

        function renderAlerts() {
            const container = document.getElementById('alertsList');

            if (allAlerts.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding: 40px;">No KPI breach alerts currently recorded.</div>';
                return;
            }

            container.innerHTML = allAlerts.map(item => {
                const kpiName = item.kpi_name || 'KPI Breach';
                const isCritical = kpiName.toLowerCase().includes('time-to-hire') || kpiName.toLowerCase().includes('offboarding');
                const sevBadge = isCritical ? 
                    '<span class="badge badge-critical">Critical</span>' : 
                    '<span class="badge badge-warning">Warning</span>';
                
                const detailUrl = getKpiUrl(kpiName);
                const timeStr = item.timestamp ? new Date(item.timestamp).toLocaleString() : 'Recent';
                const summary = formatShortSummary(item.data?.executive_summary);

                return `
                    <div class="alert-card">
                        <div class="alert-header">
                            <div class="alert-title">
                                🚨 ${kpiName}
                                ${sevBadge}
                                <span class="badge badge-active">Active</span>
                            </div>
                            <div class="alert-time">📅 ${timeStr}</div>
                        </div>
                        <div class="alert-summary">
                            ${summary}
                        </div>
                        <div class="alert-footer">
                            <span class="meta-id">Incident ID: ${item.id.slice(-6)}</span>
                            <div>
                                <a href="${detailUrl}" class="btn btn-primary">View Breach Details →</a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Theme Switcher Logic
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                document.documentElement.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
                document.documentElement.classList.remove('light-theme');
            }
            updateThemeIcon(savedTheme);
        }

        function toggleTheme() {
            const isLight = document.body.classList.toggle('light-theme');
            document.documentElement.classList.toggle('light-theme', isLight);
            const theme = isLight ? 'light' : 'dark';
            localStorage.setItem('theme', theme);
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            const svg = document.getElementById('theme-icon');
            const btn = document.getElementById('btn-theme-toggle');
            if (!svg) return;
            if (theme === 'light') {
                svg.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m0 13.5V21m9.75-9h-2.25m-13.5 0H3m16.035-6.785l-1.59 1.59M6.343 17.657l-1.59 1.59m12.728 0l-1.59-1.59M6.343 6.343L4.753 4.753M12 9.75a2.25 2.25 0 100 4.5 2.25 2.25 0 000-4.5z" />
                `;
                if (btn) btn.setAttribute('title', 'Switch to Dark Theme');
            } else {
                svg.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
                `;
                if (btn) btn.setAttribute('title', 'Switch to Light Theme');
            }
        }

        window.onload = function() {
            initTheme();
            loadAlerts();
        };
    </script>
</body>
</html>
