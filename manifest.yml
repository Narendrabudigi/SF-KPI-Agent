---
applications:
  - name: SF-kpi-agentic-ai
    memory: 512M
    disk_quota: 1G
    buildpacks:
      - python_buildpack
    path: .
    command: uvicorn main:app --host 0.0.0.0 --port $PORT
    # You will need to configure your environment variables (like GEMINI_API_KEY, OAUTH credentials)
    # inside the SAP BTP Cockpit -> User-Provided Variables after deployment,
    # or you can add an `env:` section here (but don't commit secrets to GitHub!).
    env:
      PYTHON_VERSION: 3.12.x
