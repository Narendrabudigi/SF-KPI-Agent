name: Auto Deploy to SAP BTP Cloud Foundry

on:
  push:
    branches:
      - main

jobs:
  btp-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Cloud Foundry CLI v8
      uses: cloudfoundry/actions-cf-cli@v1
      with:
        version: v8

    - name: Authenticate and Push Live to BTP
      env:
        CF_API: ${{ secrets.CF_API }}
        CF_USERNAME: ${{ secrets.CF_USERNAME }}
        CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
      run: |
        # Secure standard login block
        cf login -a "$CF_API" -u "$CF_USERNAME" -p "$CF_PASSWORD"
        # Deploy your application live
        cf push
