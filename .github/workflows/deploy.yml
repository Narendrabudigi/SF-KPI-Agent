name: Auto Deploy to SAP BTP Cloud Foundry

on:
  push:
    branches:
      - main  # Automatically triggers the deployment every time you push code to the main branch

jobs:
  btp-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download the source code repository onto the runner machine
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Step 2: Establish the isolated Python runtime engine environment
    - name: Set up Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Step 3: Initialize the Cloud Foundry CLI using a verified marketplace action
    - name: Initialize Cloud Foundry CLI
      uses: jasonmccallister/setup-cf-cli@v2
      with:
        cf_api: ${{ secrets.CF_API }}
        cf_username: ${{ secrets.CF_USERNAME }}
        cf_password: ${{ secrets.CF_PASSWORD }}
        # Setting version to 8 handles standard Cloud Foundry API updates perfectly
        cf_cli_version: '8'

    # Step 4: Execute the application push command
    - name: Deploy Live to BTP
      run: |
        # Deploy your application smoothly using the manifest.yml configurations
        cf push
